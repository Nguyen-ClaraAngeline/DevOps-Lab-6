services:
  db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: postgres:16.4-bookworm
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./db/migrations:/migrations:ro
      - ./db/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  api:
    build: ./api
    image: ${API_IMAGE:-fulfillops-api:local}
    build: ./api
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health/ready').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build: ./worker
    image: ${WORKER_IMAGE:-fulfillops-worker:local}
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_MODE: ${TEST_MODE:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata: